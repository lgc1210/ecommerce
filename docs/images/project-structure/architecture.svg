<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#948a7c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#faf6f0" />

  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1815">Sơ đồ kiến trúc tổng thể</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#948a7c">Ecommerce Platform — 3 service độc lập</text>

  <!-- Browser (bên trái, ngang hàng frontend) -->
  <rect x="30" y="110" width="220" height="120" rx="14" fill="#f3ede4" stroke="#948a7c" stroke-width="1.5" />
  <text x="140" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1815">Trình duyệt</text>
  <text x="140" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1815">người dùng</text>
  <text x="140" y="196" text-anchor="middle" font-size="12" fill="#2c2620">Khách hàng &amp; quản trị viên</text>

  <!-- Frontend -->
  <rect x="330" y="110" width="260" height="120" rx="14" fill="#ffffff" stroke="#d9641f" stroke-width="2" />
  <text x="460" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1815">frontend/</text>
  <text x="460" y="162" text-anchor="middle" font-size="12" fill="#2c2620">React 19 + TypeScript + Vite</text>
  <text x="460" y="180" text-anchor="middle" font-size="12" fill="#2c2620">Client SPA + Admin SPA</text>
  <text x="460" y="200" text-anchor="middle" font-size="11" fill="#948a7c">localhost:5173</text>

  <!-- Backend -->
  <rect x="670" y="110" width="260" height="140" rx="14" fill="#ffffff" stroke="#1c1815" stroke-width="2" />
  <text x="800" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1815">backend/</text>
  <text x="800" y="162" text-anchor="middle" font-size="12" fill="#2c2620">Node.js + Express 5</text>
  <text x="800" y="180" text-anchor="middle" font-size="12" fill="#2c2620">Prisma ORM → MySQL</text>
  <text x="800" y="198" text-anchor="middle" font-size="12" fill="#2c2620">Auth · RBAC · Orders · Payments</text>
  <text x="800" y="220" text-anchor="middle" font-size="11" fill="#948a7c">localhost:5000</text>

  <!-- Strapi (dưới frontend) -->
  <rect x="330" y="320" width="260" height="120" rx="14" fill="#ffffff" stroke="#b84f14" stroke-width="2" stroke-dasharray="5,3" />
  <text x="460" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1815">strapi-cms/</text>
  <text x="460" y="372" text-anchor="middle" font-size="12" fill="#2c2620">Strapi 5 — CMS phụ trợ</text>
  <text x="460" y="390" text-anchor="middle" font-size="12" fill="#2c2620">Nội dung tĩnh: Home/About/Contact</text>
  <text x="460" y="410" text-anchor="middle" font-size="11" fill="#948a7c">localhost:1337</text>

  <!-- MySQL -->
  <rect x="740" y="330" width="120" height="70" rx="10" fill="#fbe6d3" stroke="#d9641f" stroke-width="1.5" />
  <text x="800" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1815">MySQL</text>
  <text x="800" y="378" text-anchor="middle" font-size="11" fill="#2c2620">database</text>

  <!-- External services -->
  <rect x="670" y="440" width="260" height="150" rx="14" fill="#f3ede4" stroke="#948a7c" stroke-width="1.5" />
  <text x="800" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1815">Dịch vụ bên thứ ba</text>
  <text x="800" y="492" text-anchor="middle" font-size="12" fill="#2c2620">GHN — vận chuyển</text>
  <text x="800" y="512" text-anchor="middle" font-size="12" fill="#2c2620">VNPay · ZaloPay — thanh toán</text>
  <text x="800" y="532" text-anchor="middle" font-size="12" fill="#2c2620">Google · Facebook — OAuth</text>
  <text x="800" y="552" text-anchor="middle" font-size="12" fill="#2c2620">SMTP — gửi email OTP</text>

  <!-- Arrows -->
  <!-- Browser -> Frontend (ngang) -->
  <line x1="250" y1="170" x2="326" y2="170" stroke="#948a7c" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Frontend <-> Backend -->
  <line x1="590" y1="160" x2="666" y2="160" stroke="#d9641f" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="628" y="148" text-anchor="middle" font-size="10.5" fill="#b84f14">REST /api</text>
  <text x="628" y="185" text-anchor="middle" font-size="9.5" fill="#b84f14">(cookie httpOnly)</text>

  <!-- Frontend <-> Strapi -->
  <line x1="460" y1="234" x2="460" y2="316" stroke="#b84f14" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="380" y="278" font-size="11" fill="#b84f14">REST /api</text>
  <text x="380" y="292" font-size="11" fill="#b84f14">(nội dung tĩnh)</text>

  <!-- Backend -> MySQL -->
  <line x1="800" y1="254" x2="800" y2="326" stroke="#1c1815" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Backend -> External -->
  <line x1="870" y1="254" x2="870" y2="436" stroke="#948a7c" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="905" y="350" font-size="11" fill="#948a7c">tích hợp trực tiếp</text>

  <!-- Legend -->
  <rect x="670" y="60" width="14" height="4" fill="#d9641f" />
  <text x="690" y="66" font-size="11" fill="#2c2620">Nghiệp vụ giao dịch (auth, đơn hàng…)</text>
  <rect x="670" y="80" width="14" height="4" fill="#b84f14" stroke-dasharray="2,2" />
  <text x="690" y="86" font-size="11" fill="#2c2620">Nội dung tĩnh / marketing (CMS)</text>
</svg>
