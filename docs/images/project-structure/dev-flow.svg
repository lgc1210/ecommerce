<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#948a7c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#faf6f0" />

  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1815">Luồng chạy dev — 3 service song song</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#948a7c">Mở 3 terminal riêng biệt, chạy đồng thời</text>

  <!-- Step 0: prerequisite -->
  <rect x="330" y="90" width="300" height="56" rx="10" fill="#fbe6d3" stroke="#d9641f" stroke-width="1.5" />
  <text x="480" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1c1815">Chuẩn bị trước</text>
  <text x="480" y="132" text-anchor="middle" font-size="11" fill="#2c2620">Cài đặt &amp; chạy MySQL cục bộ (DATABASE_URL)</text>

  <line x1="480" y1="146" x2="480" y2="176" stroke="#948a7c" stroke-width="1.6" marker-end="url(#arrow2)" />

  <!-- 3 terminal columns -->
  <!-- Terminal 1: backend -->
  <rect x="40" y="180" width="270" height="230" rx="12" fill="#1c1815" />
  <text x="175" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#faf6f0">Terminal 1 — backend</text>
  <text x="60" y="236" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">cd backend</text>
  <text x="60" y="256" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">npm install</text>
  <text x="60" y="276" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">cp .env.example .env.development</text>
  <text x="60" y="296" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">npm run db:migrate</text>
  <text x="60" y="316" font-size="12" fill="#fbe6d3" font-family="Consolas, monospace">npm run dev</text>
  <text x="175" y="345" text-anchor="middle" font-size="11" fill="#d9641f">→ seed roles/permissions tự động</text>
  <text x="175" y="365" text-anchor="middle" font-size="11" fill="#d9641f">→ tự kết nối MySQL qua Prisma</text>
  <text x="175" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#faf6f0">http://localhost:5000</text>

  <!-- Terminal 2: strapi -->
  <rect x="345" y="180" width="270" height="230" rx="12" fill="#1c1815" />
  <text x="480" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#faf6f0">Terminal 2 — strapi-cms</text>
  <text x="365" y="236" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">cd strapi-cms</text>
  <text x="365" y="256" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">npm install</text>
  <text x="365" y="276" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">cp .env.example .env</text>
  <text x="365" y="296" font-size="12" fill="#fbe6d3" font-family="Consolas, monospace">npm run develop</text>
  <text x="480" y="325" text-anchor="middle" font-size="11" fill="#d9641f">→ mở Strapi Admin, tạo tài</text>
  <text x="480" y="342" text-anchor="middle" font-size="11" fill="#d9641f">khoản quản trị lần đầu</text>
  <text x="480" y="365" text-anchor="middle" font-size="11" fill="#d9641f">→ nhập nội dung Home/About/Contact</text>
  <text x="480" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#faf6f0">http://localhost:1337</text>

  <!-- Terminal 3: frontend -->
  <rect x="650" y="180" width="270" height="230" rx="12" fill="#1c1815" />
  <text x="785" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#faf6f0">Terminal 3 — frontend</text>
  <text x="670" y="236" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">cd frontend</text>
  <text x="670" y="256" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">npm install</text>
  <text x="670" y="276" font-size="12" fill="#e8e0d4" font-family="Consolas, monospace">cp .env.example .env</text>
  <text x="670" y="296" font-size="12" fill="#fbe6d3" font-family="Consolas, monospace">npm run dev</text>
  <text x="785" y="325" text-anchor="middle" font-size="11" fill="#d9641f">→ VITE_API_BASE_URL trỏ :5000</text>
  <text x="785" y="342" text-anchor="middle" font-size="11" fill="#d9641f">→ VITE_STRAPI_BASE_URL trỏ :1337</text>
  <text x="785" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#faf6f0">http://localhost:5173</text>

  <!-- order note -->
  <text x="175" y="170" text-anchor="middle" font-size="11" fill="#948a7c">chạy trước (frontend cần data)</text>
  <text x="785" y="170" text-anchor="middle" font-size="11" fill="#948a7c">chạy sau cùng</text>

  <!-- Arrows down to browser -->
  <line x1="175" y1="410" x2="480" y2="470" stroke="#948a7c" stroke-width="1.6" marker-end="url(#arrow2)" />
  <line x1="480" y1="410" x2="480" y2="470" stroke="#948a7c" stroke-width="1.6" marker-end="url(#arrow2)" />
  <line x1="785" y1="410" x2="480" y2="470" stroke="#d9641f" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Browser box -->
  <rect x="330" y="480" width="300" height="80" rx="14" fill="#ffffff" stroke="#d9641f" stroke-width="2" />
  <text x="480" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1815">Trình duyệt</text>
  <text x="480" y="532" text-anchor="middle" font-size="12" fill="#2c2620">Mở http://localhost:5173</text>
  <text x="480" y="548" text-anchor="middle" font-size="11" fill="#948a7c">Frontend tự gọi backend + strapi phía sau</text>

  <!-- Tunnel note -->
  <rect x="200" y="580" width="560" height="46" rx="10" fill="#f3ede4" stroke="#948a7c" stroke-width="1" stroke-dasharray="4,3" />
  <text x="480" y="600" text-anchor="middle" font-size="11" fill="#2c2620">Cần webhook/IPN công khai (GHN, VNPay, ZaloPay)?</text>
  <text x="480" y="616" text-anchor="middle" font-size="11" fill="#2c2620">Mở thêm 1 terminal chạy ngrok/cloudflared trỏ vào backend :5000</text>
</svg>
