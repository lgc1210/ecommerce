[build.environment]
  VITE_API_BASE_URL = "https://retail-ecommerce-production.up.railway.app/api"
  VITE_SOCKET_URL = "https://retail-ecommerce-production.up.railway.app"

[[redirects]]
  from = "/api/*"
  to = "https://retail-ecommerce-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://retail-ecommerce-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200